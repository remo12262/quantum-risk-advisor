name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli@latest

      - name: Accept licenses and init
        run: |
          yes | bubblewrap init \
            --manifest https://quantumcyberlabs.com/manifest.json \
            --directory ./twa \
            2>/dev/null || true

      - name: Build
        run: |
          cd twa
          yes | bubblewrap build 2>/dev/null || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: politicalab-apk
          path: 'twa/**/*.apk'
          if-no-files-found: warn
