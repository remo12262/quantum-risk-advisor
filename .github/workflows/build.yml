name: Build Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      JAVA_HOME: /opt/hostedtoolcache/Java_Temurin_jdk/17.0.14-7/x64
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli@latest

      - name: Init TWA
        run: |
          mkdir -p twa
          cd twa
          bubblewrap init \
            --manifest https://quantumcyberlabs.com/manifest.json \
            --jdkPath $JAVA_HOME \
            --androidSdkPath $ANDROID_SDK_ROOT
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

      - name: Build APK
        run: |
          cd twa
          bubblewrap build \
            --jdkPath $JAVA_HOME \
            --androidSdkPath $ANDROID_SDK_ROOT
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: quantum-risk-advisor-apk
          path: 'twa/**/*.apk'
          if-no-files-found: warn
