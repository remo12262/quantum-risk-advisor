name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli@latest

      - name: Init TWA
        run: |
          bubblewrap init \
            --manifest https://quantumcyberlabs.com/manifest.json \
            --directory ./twa << 'EOF'
          No
          No
          EOF

      - name: Build APK
        run: |
          cd twa
          bubblewrap build << 'EOF'
          No
          EOF

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: politicalab-apk
          path: 'twa/**/*.apk'
          if-no-files-found: warn
