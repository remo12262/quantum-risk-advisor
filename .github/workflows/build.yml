name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build TWA APK
        uses: chromeos/pwa-play-billing@v1
        with:
          package-id: com.quantumcyberlabs.politicalab
          host: quantumcyberlabs.com
          start-url: /politicalab.html
          name: PoliticaLab
          icon-url: https://quantumcyberlabs.com/icon-512.png

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: politicalab-apk
          path: '**/*.apk'
