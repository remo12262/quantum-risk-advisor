<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#1a1a2e">
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js');
}
</script>
<title>PoliticaLab — Political Intelligence Advisor</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1a1a2e;
    --paper: #f5f0e8;
    --cream: #ede8dc;
    --accent: #c0392b;
    --accent2: #1a6b4a;
    --gold: #b8860b;
    --mid: #6b6560;
    --border: #ccc4b8;
    --card: #ffffff;
    --warn: #e67e22;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--paper);
    color: var(--ink);
    min-height: 100vh;
  }

  /* HEADER */
  header {
    background: var(--ink);
    color: var(--paper);
    padding: 0 2rem;
    border-bottom: 3px solid var(--accent);
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 64px;
  }

  .logo {
    display: flex;
    align-items: baseline;
    gap: 0.5rem;
  }

  .logo-main {
    font-family: 'Playfair Display', serif;
    font-size: 1.6rem;
    font-weight: 900;
    letter-spacing: -0.5px;
    color: #fff;
  }

  .logo-tag {
    font-family: 'DM Mono', monospace;
    font-size: 0.65rem;
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: 2px;
    border: 1px solid var(--accent);
    padding: 2px 6px;
    border-radius: 2px;
  }

  .lang-toggle {
    display: flex;
    gap: 0.25rem;
  }

  .lang-btn {
    background: transparent;
    border: 1px solid rgba(255,255,255,0.3);
    color: rgba(255,255,255,0.6);
    padding: 4px 10px;
    font-size: 0.72rem;
    font-family: 'DM Mono', monospace;
    cursor: pointer;
    border-radius: 2px;
    transition: all 0.2s;
    letter-spacing: 1px;
  }

  .lang-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }

  /* HERO BAND */
  .hero-band {
    background: var(--cream);
    border-bottom: 1px solid var(--border);
    padding: 2.5rem 2rem 2rem;
    text-align: center;
  }

  .hero-band h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(1.8rem, 4vw, 2.8rem);
    font-weight: 900;
    line-height: 1.15;
    color: var(--ink);
    margin-bottom: 0.6rem;
  }

  .hero-band h1 span { color: var(--accent); }

  .hero-band p {
    font-size: 0.95rem;
    color: var(--mid);
    max-width: 560px;
    margin: 0 auto;
    line-height: 1.6;
  }

  /* MAIN LAYOUT */
  .main {
    max-width: 900px;
    margin: 0 auto;
    padding: 2rem 1.5rem 4rem;
    display: grid;
    grid-template-columns: 1fr;
    gap: 1.5rem;
  }

  /* CARD */
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 1.5rem 1.75rem;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  }

  .card-title {
    font-family: 'Playfair Display', serif;
    font-size: 1.05rem;
    font-weight: 700;
    color: var(--ink);
    margin-bottom: 1.2rem;
    display: flex;
    align-items: center;
    gap: 0.5rem;
    padding-bottom: 0.75rem;
    border-bottom: 1px solid var(--cream);
  }

  .card-title .step {
    background: var(--accent);
    color: #fff;
    font-family: 'DM Mono', monospace;
    font-size: 0.7rem;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  /* FORM GRID */
  .form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1rem;
  }

  @media (max-width: 600px) {
    .form-grid { grid-template-columns: 1fr; }
  }

  .field { display: flex; flex-direction: column; gap: 0.4rem; }
  .field.full { grid-column: 1 / -1; }

  label {
    font-size: 0.75rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: var(--mid);
  }

  input, select, textarea {
    font-family: 'DM Sans', sans-serif;
    font-size: 0.9rem;
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 0.55rem 0.75rem;
    background: var(--paper);
    color: var(--ink);
    transition: border-color 0.2s;
    outline: none;
  }

  input:focus, select:focus, textarea:focus {
    border-color: var(--accent);
    background: #fff;
  }

  textarea { resize: vertical; min-height: 80px; }

  /* TOPIC CHIPS */
  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
  }

  .chip {
    padding: 5px 12px;
    border: 1px solid var(--border);
    border-radius: 20px;
    font-size: 0.8rem;
    cursor: pointer;
    transition: all 0.15s;
    background: var(--paper);
    color: var(--mid);
    user-select: none;
  }

  .chip.selected {
    background: var(--ink);
    color: #fff;
    border-color: var(--ink);
  }

  /* ANALYZE BUTTON */
  .btn-analyze {
    width: 100%;
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 0.9rem 2rem;
    font-family: 'DM Sans', sans-serif;
    font-size: 1rem;
    font-weight: 600;
    border-radius: 3px;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
    letter-spacing: 0.3px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
  }

  .btn-analyze:hover { background: #a93226; }
  .btn-analyze:active { transform: scale(0.99); }
  .btn-analyze:disabled { background: var(--border); cursor: not-allowed; }

  /* LOADING */
  .loading {
    display: none;
    text-align: center;
    padding: 2.5rem;
  }

  .loading.visible { display: block; }

  .spinner {
    width: 36px;
    height: 36px;
    border: 3px solid var(--cream);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 1rem;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .loading p {
    font-size: 0.85rem;
    color: var(--mid);
    font-style: italic;
  }

  /* RESULTS */
  .results { display: none; }
  .results.visible { display: block; }

  .result-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 1.5rem;
    padding-bottom: 1rem;
    border-bottom: 2px solid var(--ink);
  }

  .result-header h2 {
    font-family: 'Playfair Display', serif;
    font-size: 1.3rem;
    font-weight: 700;
  }

  /* SCORE BADGE */
  .score-badge {
    display: flex;
    flex-direction: column;
    align-items: center;
    background: var(--ink);
    color: #fff;
    padding: 0.5rem 1rem;
    border-radius: 4px;
    min-width: 80px;
  }

  .score-num {
    font-family: 'Playfair Display', serif;
    font-size: 2rem;
    font-weight: 900;
    line-height: 1;
  }

  .score-label {
    font-family: 'DM Mono', monospace;
    font-size: 0.6rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: rgba(255,255,255,0.6);
  }

  .score-badge.high .score-num { color: #2ecc71; }
  .score-badge.mid-score .score-num { color: var(--warn); }
  .score-badge.low .score-num { color: var(--accent); }

  /* RESULT SECTIONS */
  .result-sections {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1rem;
    margin-bottom: 1rem;
  }

  @media (max-width: 600px) {
    .result-sections { grid-template-columns: 1fr; }
  }

  .result-block {
    border-radius: 3px;
    padding: 1rem 1.25rem;
    border: 1px solid var(--border);
  }

  .result-block.green { border-left: 4px solid var(--accent2); }
  .result-block.red { border-left: 4px solid var(--accent); }
  .result-block.gold { border-left: 4px solid var(--gold); grid-column: 1 / -1; }
  .result-block.blue { border-left: 4px solid #2980b9; grid-column: 1 / -1; }

  .result-block h3 {
    font-family: 'DM Mono', monospace;
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--mid);
    margin-bottom: 0.75rem;
  }

  .result-block .content {
    font-size: 0.88rem;
    line-height: 1.65;
    color: var(--ink);
    white-space: pre-wrap;
  }

  /* DIVIDER */
  .divider {
    text-align: center;
    color: var(--border);
    font-size: 1.2rem;
    letter-spacing: 6px;
    margin: 0.5rem 0;
  }

  /* RESET */
  .btn-reset {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--mid);
    padding: 0.5rem 1.2rem;
    font-size: 0.82rem;
    border-radius: 3px;
    cursor: pointer;
    font-family: 'DM Sans', sans-serif;
    transition: all 0.2s;
    margin-top: 1rem;
  }

  .btn-reset:hover { border-color: var(--ink); color: var(--ink); }

  /* FOOTER */
  footer {
    text-align: center;
    padding: 1.5rem;
    font-family: 'DM Mono', monospace;
    font-size: 0.65rem;
    letter-spacing: 1px;
    color: var(--border);
    text-transform: uppercase;
    border-top: 1px solid var(--border);
  }

  /* PAYWALL MODAL */
  .paywall-overlay {
    display: none;
    position: fixed; inset: 0; z-index: 1000;
    background: rgba(26,26,46,0.75);
    align-items: center; justify-content: center;
    padding: 1rem;
  }
  .paywall-box {
    background: #fff;
    border-radius: 6px;
    max-width: 420px; width: 100%;
    padding: 2.5rem 2rem;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.25);
  }
  .paywall-icon { font-size: 2.5rem; margin-bottom: 1rem; }
  .paywall-title {
    font-family: 'Playfair Display', serif;
    font-size: 1.4rem; font-weight: 700;
    color: var(--ink); margin-bottom: 0.5rem;
  }
  .paywall-desc { font-size: 0.88rem; color: var(--mid); line-height: 1.6; margin-bottom: 1.5rem; }
  .paywall-price {
    font-family: 'Playfair Display', serif;
    font-size: 2.2rem; font-weight: 900;
    color: var(--accent); margin-bottom: 0.25rem;
  }
  .paywall-price-desc { font-size: 0.78rem; color: var(--mid); margin-bottom: 1.5rem; }
  .btn-paypal {
    width: 100%; background: #0070ba; color: #fff;
    border: none; padding: 0.9rem; border-radius: 4px;
    font-size: 1rem; font-weight: 700; cursor: pointer;
    font-family: 'DM Sans', sans-serif;
    display: flex; align-items: center; justify-content: center; gap: 0.5rem;
    transition: background 0.2s; margin-bottom: 0.75rem;
  }
  .btn-paypal:hover { background: #005ea6; }
  .btn-paypal-cancel {
    background: transparent; border: none;
    color: var(--mid); font-size: 0.8rem; cursor: pointer;
    font-family: 'DM Sans', sans-serif; padding: 0.4rem;
  }
  .usage-counter {
    font-family: 'DM Mono', monospace;
    font-size: 0.65rem; letter-spacing: 1px;
    text-transform: uppercase; color: var(--mid);
    text-align: right; padding: 0.5rem 0;
    border-top: 1px solid var(--border);
    margin-bottom: 0.5rem;
  }
</style>
</head>
<body>

<header>
  <div class="logo">
    <span class="logo-main">PoliticaLab</span>
    <span class="logo-tag">Beta</span>
  </div>
  <div class="lang-toggle">
    <button class="lang-btn active" onclick="setLang('it')">IT</button>
    <button class="lang-btn" onclick="setLang('en')">EN</button>
  </div>
</header>

<div class="hero-band">
  <h1 data-it="Intelligenza Strategica per la <span>Comunicazione Politica</span>" data-en="Strategic Intelligence for <span>Political Communication</span>"></h1>
  <p data-it="Inserisci il contesto elettorale e i temi su cui vuoi comunicare. PoliticaLab analizza il territorio, suggerisce il framing più efficace e valuta il tuo posizionamento." data-en="Enter your electoral context and the issues you want to communicate on. PoliticaLab analyzes the territory, suggests the most effective framing, and evaluates your positioning."></p>
</div>

<div class="main">

  <!-- STEP 1: CONTESTO -->
  <div class="card">
    <div class="card-title">
      <span class="step">1</span>
      <span data-it="Contesto Elettorale" data-en="Electoral Context"></span>
    </div>
    <div class="form-grid">
      <div class="field">
        <label data-it="Città / Territorio" data-en="City / Territory"></label>
        <input type="text" id="city" placeholder="es. Palermo, Catania, Roma..." />
      </div>
      <div class="field">
        <label data-it="Tipo di elezione" data-en="Election type"></label>
        <select id="electionType">
          <option value="" data-it="— Seleziona —" data-en="— Select —"></option>
          <option value="comunali" data-it="Elezioni Comunali" data-en="Municipal Elections"></option>
          <option value="regionali" data-it="Elezioni Regionali" data-en="Regional Elections"></option>
          <option value="politiche" data-it="Elezioni Politiche" data-en="National Elections"></option>
          <option value="europee" data-it="Elezioni Europee" data-en="European Elections"></option>
        </select>
      </div>
      <div class="field">
        <label data-it="Orientamento politico" data-en="Political orientation"></label>
        <select id="orientation">
          <option value="" data-it="— Seleziona —" data-en="— Select —"></option>
          <option value="centrosinistra" data-it="Centro-sinistra" data-en="Centre-left"></option>
          <option value="centrodestra" data-it="Centro-destra" data-en="Centre-right"></option>
          <option value="civica" data-it="Lista civica" data-en="Civic list"></option>
          <option value="movimento" data-it="Movimento / alternativa" data-en="Movement / alternative"></option>
          <option value="sinistra" data-it="Sinistra" data-en="Left"></option>
          <option value="destra" data-it="Destra" data-en="Right"></option>

      </div>
      <div class="field">
        <label data-it="Target demografico" data-en="Target demographic"></label>
        <select id="demographic">
          <option value="" data-it="— Seleziona —" data-en="— Select —"></option>
          <option value="giovani" data-it="Giovani (18–35)" data-en="Young (18–35)"></option>
          <option value="adulti" data-it="Adulti (35–55)" data-en="Adults (35–55)"></option>

          <option value="generale" data-it="Elettorato generale" data-en="General electorate"></option>
        </select>
      </div>
    </div>
  </div>

  <!-- STEP 2: TEMI -->
  <div class="card">
    <div class="card-title">
      <span class="step">2</span>
      <span data-it="Temi su cui vuoi comunicare" data-en="Issues you want to communicate on"></span>
    </div>
    <div class="chips" id="topicChips"></div>
  </div>

  <!-- STEP 3: MESSAGGIO -->
  <div class="card">
    <div class="card-title">
      <span class="step">3</span>
      <span data-it="Il tuo messaggio (opzionale)" data-en="Your message (optional)"></span>
    </div>
    <div class="form-grid">
      <div class="field">
        <label data-it="Tipo di contenuto" data-en="Content type"></label>
        <select id="contentType">
          <option value="post_social" data-it="Post social media" data-en="Social media post"></option>

          <option value="comunicato" data-it="Comunicato stampa" data-en="Press release"></option>
          <option value="volantino" data-it="Volantino / manifesto" data-en="Flyer / poster"></option>
          <option value="intervista" data-it="Intervista" data-en="Interview"></option>

  <!-- LOADING -->

  <!-- RESULTS -->

    <div class="result-sections">

<div class="paywall-overlay" id="paywallModal">

    <div class="paywall-icon">🔒</div>
    <div class="paywall-title" data-it="Accesso Premium" data-en="Premium Access"></div>

    <button class="btn-paypal" onclick="goToPayPal()">
      <span>💳</span>
      <span data-it="Paga con PayPal" data-en="Pay with PayPal"></span>
    </button>
    <button class="btn-paypal-cancel" onclick="closePaywall()" data-it="Annulla" data-en="Cancel"></button>
  </div>
</div>

<script>
// ─── LANGUAGE ─────────────────────────────────────────────────────────────────
let currentLang = 'it';

const topics = {
  it: ['Sicurezza urbana','Lavoro e occupazione','Sanità locale','Tasse e tributi',
       'Ambiente e verde pubblico','Mobilità e trasporti','Immigrazione','Scuola e istruzione',
       'Giovani e futuro','Turismo e cultura','Imprese e commercio','Welfare e sociale',
       'Corruzione e legalità','Casa e affitti','Digitalizzazione PA'],
  en: ['Urban security','Jobs and employment','Local healthcare','Taxes and fees',
       'Environment and green spaces','Mobility and transport','Immigration','Schools and education',
       'Youth and future','Tourism and culture','Business and trade','Welfare and social',
       'Corruption and legality','Housing and rents','PA digitalization']
};

let selectedTopics = [];

function setLang(lang) {
  currentLang = lang;
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
  document.querySelector(`.lang-btn[onclick="setLang('${lang}')"]`).classList.add('active');

  document.querySelectorAll('[data-it]').forEach(el => {
    const txt = el.getAttribute('data-' + lang);
    if (el.tagName === 'OPTION') {
      el.textContent = txt;
    } else if (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') {
      // skip
    } else {
      el.innerHTML = txt;
    }
  });

  buildChips();

  document.querySelectorAll('select option[data-it]').forEach(opt => {
    opt.textContent = opt.getAttribute('data-' + lang);
  });

  document.getElementById('userMessage').placeholder =
    lang === 'it' ? 'Scrivi qui il tuo messaggio da analizzare...' : 'Write your message to analyze here...';
}

function buildChips() {
  const container = document.getElementById('topicChips');
  container.innerHTML = '';
  topics[currentLang].forEach((t, i) => {
    const div = document.createElement('div');
    div.className = 'chip' + (selectedTopics.includes(i) ? ' selected' : '');
    div.textContent = t;
    div.onclick = () => toggleTopic(i, div);
    container.appendChild(div);
  });
}

function toggleTopic(i, el) {
  if (selectedTopics.includes(i)) {
    selectedTopics = selectedTopics.filter(x => x !== i);
    el.classList.remove('selected');
  } else {
    selectedTopics.push(i);
    el.classList.add('selected');
  }
}

// ─── PAYPAL GATE ──────────────────────────────────────────────────────────────
const PAYPAL_URL = 'https://www.paypal.com/ncp/payment/7CKDLPYGJ8S6L';
const FREE_LIMIT = 0;       // ← NESSUNA PROVA GRATUITA
const PAID_ANALYSES = 10;

function getUsage() { return parseInt(localStorage.getItem('pl_usage') || '0'); }
function getPaid()  { return parseInt(localStorage.getItem('pl_paid')  || '0'); }
function canAnalyze() {
  return getUsage() < FREE_LIMIT + getPaid();
}
function showPaywallModal() {
  document.getElementById('paywallModal').style.display = 'flex';
  document.querySelectorAll('#paywallModal [data-it]').forEach(el => {
    el.textContent = el.getAttribute('data-' + currentLang);
  });
}
function closePaywall() {
  document.getElementById('paywallModal').style.display = 'none';
}
function goToPayPal() {
  localStorage.setItem('pl_paid', getPaid() + PAID_ANALYSES);
  window.open(PAYPAL_URL, '_blank');
  closePaywall();
}
function updateCounter() {
  const used = getUsage();
  const total = FREE_LIMIT + getPaid();
  const remaining = Math.max(0, total - used);
  const el = document.getElementById('usageCounter');
  if (el) {
    el.textContent = currentLang === 'it'
      ? `Analisi rimanenti: ${remaining}`
      : `Remaining analyses: ${remaining}`;
    el.style.display = 'block';
  }
}

// ─── ANALYZE ──────────────────────────────────────────────────────────────────
async function analyze() {
  const city = document.getElementById('city').value.trim();
  const electionType = document.getElementById('electionType').value;
  const orientation = document.getElementById('orientation').value;
  const demographic = document.getElementById('demographic').value;
  const contentType = document.getElementById('contentType').value;
  const userMessage = document.getElementById('userMessage').value.trim();
  const selectedThemes = selectedTopics.map(i => topics[currentLang][i]);

  // PAYWALL CHECK — scatta sempre al primo clic
  if (!canAnalyze()) {
    showPaywallModal();
    return;
  }

  if (!city) {
    alert(currentLang === 'it' ? 'Inserisci la città o il territorio.' : 'Please enter a city or territory.');
    return;
  }
  if (selectedThemes.length === 0) {
    alert(currentLang === 'it' ? 'Seleziona almeno un tema.' : 'Select at least one topic.');
    return;
  }

  document.getElementById('analyzeBtn').disabled = true;
  document.getElementById('loading').classList.add('visible');
  document.getElementById('results').classList.remove('visible');

  const langInstruction = currentLang === 'it'
    ? 'Rispondi ESCLUSIVAMENTE in italiano.'
    : 'Reply EXCLUSIVELY in English.';

  const prompt = `${langInstruction}

Sei PoliticaLab, un advisor di intelligenza strategica per la comunicazione politica locale.

CONTESTO:
- Città/Territorio: ${city}
- Tipo elezione: ${electionType || 'non specificato'}
- Orientamento politico: ${orientation || 'non specificato'}
- Target demografico: ${demographic || 'generale'}
- Temi selezionati: ${selectedThemes.join(', ')}
- Tipo di contenuto: ${contentType}
${userMessage ? `- Bozza messaggio dell'utente: "${userMessage}"` : '- Nessuna bozza fornita (genera suggerimenti da zero)'}

Analizza il contesto e rispondi con ESATTAMENTE questo formato JSON (senza markdown, solo JSON puro):

{
  "score": <numero intero da 1 a 100 che rappresenta l'efficacia comunicativa stimata>,
  "framing": "<2-4 paragrafi su come affrontare i temi selezionati: angolo narrativo, tono, approccio consigliato per il territorio e target indicato>",
  "risks": "<elenco puntato con • di 4-6 parole, concetti o posizionamenti da evitare assolutamente, con breve spiegazione del perché>",
  "messages": "<3-5 messaggi chiave pronti all'uso, numerati, adatti al tipo di contenuto selezionato>",
  "assessment": "<valutazione strategica complessiva: punti di forza del posizionamento, rischi principali, raccomandazioni per la campagna>"
}`;

  try {
    const response = await fetch('https://q-strategix-backend-1-0w5h.onrender.com/api/analyze', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ prompt, city })
    });

    const data = await response.json();
    const raw = data.result || '';
    const clean = raw.replace(/```json|```/g, '').trim();
    const parsed = JSON.parse(clean);

    document.getElementById('resFraming').textContent = parsed.framing || '—';
    document.getElementById('resRisks').textContent = parsed.risks || '—';
    document.getElementById('resMessages').textContent = parsed.messages || '—';
    document.getElementById('resAssessment').textContent = parsed.assessment || '—';

    const score = parseInt(parsed.score) || 0;
    document.getElementById('scoreNum').textContent = score;
    const badge = document.getElementById('scoreBadge');
    badge.classList.remove('high', 'mid-score', 'low');
    if (score >= 70) badge.classList.add('high');
    else if (score >= 40) badge.classList.add('mid-score');
    else badge.classList.add('low');

    localStorage.setItem('pl_usage', getUsage() + 1);
    updateCounter();
    document.getElementById('results').classList.add('visible');
    document.getElementById('results').scrollIntoView({ behavior: 'smooth' });

  } catch (err) {
    alert(currentLang === 'it'
      ? 'Errore nell\'analisi. Riprova tra qualche istante.'
      : 'Analysis error. Please try again in a moment.');
    console.error(err);
  } finally {
    document.getElementById('loading').classList.remove('visible');
    document.getElementById('analyzeBtn').disabled = false;
  }
}

function resetForm() {
  document.getElementById('results').classList.remove('visible');
  document.getElementById('city').value = '';
  document.getElementById('electionType').value = '';
  document.getElementById('orientation').value = '';
  document.getElementById('demographic').value = '';
  document.getElementById('userMessage').value = '';
  selectedTopics = [];
  buildChips();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ─── INIT ─────────────────────────────────────────────────────────────────────
buildChips();
setLang('it');
</script>
